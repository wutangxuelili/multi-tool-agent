name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 最小权限：CI 只需要读代码
permissions:
  contents: read

# 同一个分支连续推送时取消上一次未完成的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.17.1

      - name: Ruff check
        run: ruff check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Initialize database (smoke test for scripts/init_db.py)
        run: python scripts/init_db.py

      # 测试不需要 .env / API Key：LLM 在节点里惰性创建，测试注入脚本化假 LLM
      - name: Run tests
        run: |
          set +e
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            python -m pytest -q --tb=line --cov --cov-fail-under=70 2>&1 | tee pytest.log
          else
            python -m pytest -q --tb=line 2>&1 | tee pytest.log
          fi
          status=${PIPESTATUS[0]}
          # 把失败用例变成 GitHub 注解：不用登录也能在 API 里看到失败原因
          grep -E "^(FAILED|ERROR)" pytest.log | head -20 | while IFS= read -r line; do
            echo "::error title=pytest::$line"
          done
          exit $status
