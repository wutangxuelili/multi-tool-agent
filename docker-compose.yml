services:
  internal-api:
    build: .
    command: uvicorn internal_api.server:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  agent:
    build: .
    # 交互式一问一答（会提示 yes/no 确认敏感操作）：
    #   docker compose run --rm agent
    # 旧写法是 `sleep infinity` 保活等 `docker exec`，属于调试残留，已移除。
    command: sh -c "python scripts/init_db.py && python main.py"
    depends_on:
      internal-api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      INTERNAL_API_BASE: http://internal-api:8001
      # 运行时产物落在命名卷里，避免与宿主机目录属主（镜像内是非 root 用户）打架
      DATA_DIR: /app/data
      LOGS_DIR: /app/logs
    volumes:
      - agent-data:/app/data
      - agent-logs:/app/logs
      # documents/ 只读挂载：file_server 只读它，白名单由 Server 侧强制
      - ./documents:/app/documents:ro
    stdin_open: true
    tty: true

volumes:
  agent-data:
  agent-logs:
