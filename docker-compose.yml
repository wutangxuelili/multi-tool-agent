services:
  internal-api:
    build: .
    command: uvicorn internal_api.server:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  agent:
    build: .
    # 先初始化数据库，然后保持运行等待 exec
    command: sh -c "python scripts/inint_db.py && sleep infinity"
    depends_on:
      internal-api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      INTERNAL_API_BASE: http://internal-api:8001
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./documents:/app/documents
    stdin_open: true
    tty: true
    restart: unless-stopped